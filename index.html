<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>声部功能识别 · 演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0e; --panel:rgba(13,13,14,.62); --ink:#f3efe8; --ink2:rgba(243,239,232,.66); --ink3:rgba(243,239,232,.40);
  --line:rgba(243,239,232,.11); --line2:rgba(243,239,232,.22);
  --lead:#ee5e23; --dbl:#c21f55; --ctr:#01a2c5; --har:#2f66c4; --riff:#9e71fd;
  --serif:'Instrument Serif','Noto Serif SC','Songti SC',Georgia,serif;
  --zh:'Noto Serif SC','Songti SC','SimSun',serif;
  --ui:'Inter Tight','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,'Microsoft YaHei UI',monospace;
  --name:var(--zh);            /* 轨名、功能名用的字体：中文用宋体，英文用无衬线 */
  --ease:cubic-bezier(.2,.8,.2,1); --lvl:0;
}
html[lang=en]{--name:var(--ui)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.dim{color:var(--ink3)}

/* 背景：两团缓慢漂移的光，播放时随音量微微变亮；上面盖一层颗粒 */
.aura{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aura i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(120px);opacity:calc(.13 + var(--lvl)*.2);will-change:transform}
.aura i:first-child{background:var(--lead);left:-22vmax;top:-26vmax;animation:drift1 40s ease-in-out infinite alternate}
.aura i:last-child{background:var(--har);right:-22vmax;bottom:-28vmax;animation:drift2 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(24vmax,16vmax) scale(1.18)}}
@keyframes drift2{to{transform:translate(-20vmax,-12vmax) scale(.88)}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.view{position:relative;z-index:2;transition:opacity .45s var(--ease),transform .6s var(--ease)}
.view.out{opacity:0;transform:translateY(14px)}

/* 中 / EN 开关 */
.lang{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;vertical-align:middle}
.lang button{padding:3px 10px;border-radius:999px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink2);transition:background .25s,color .25s}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.lvl{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;vertical-align:middle;margin-right:8px}
.lvl button{padding:3px 10px;border-radius:999px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink2);transition:background .25s,color .25s}
.lvl button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.vsw{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;vertical-align:middle;margin-right:8px}
.vsw button{padding:3px 10px;border-radius:999px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink2);transition:background .25s,color .25s}
.vsw button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
body.viewBar .beatOnly{display:none!important}

/* 两个分区之间的切换：标注核对 / 重生成结果（后者是 /regen.html） */
.sections{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px}
.sections a{padding:5px 14px;border-radius:999px;font-size:12.5px;color:var(--ink2);transition:background .25s,color .25s;white-space:nowrap}
.sections a:hover{color:var(--ink)}
.sections a[aria-current=page]{background:var(--ink);color:var(--bg)}
.top .l{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* ---------- 首页 ---------- */
#home{min-height:100vh;padding:22px clamp(18px,5vw,76px) 70px}
.top{display:flex;gap:18px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.top .r{display:flex;gap:16px;align-items:center}
.hero{padding:clamp(36px,8vh,104px) 0 clamp(26px,5vh,56px);display:grid;gap:24px}
.kicker{color:var(--lead)}
.title{font-family:var(--zh);font-weight:900;font-size:clamp(58px,13.2vw,228px);line-height:.94;letter-spacing:-.025em}
.title .ln{display:block;overflow:hidden;padding-bottom:.06em}
.title .ln>b{display:inline-block;font-weight:inherit;transform:translateY(108%);animation:rise 1.1s var(--ease) forwards}
.title .ln:nth-child(2)>b{animation-delay:.12s}
.title em{font-style:normal;color:var(--lead)}
html[lang=en] .title{font-family:var(--serif);font-weight:400;font-size:clamp(52px,11.4vw,196px);line-height:.9;letter-spacing:-.03em}
html[lang=en] .title em{font-style:italic}
@keyframes rise{to{transform:none}}
.lede{max-width:44em;font-size:clamp(15px,1.25vw,18px);line-height:1.75;color:var(--ink2)}
.legend{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:4px}
.legend li{display:flex;align-items:flex-end;gap:9px}
.glyph{width:16px;height:22px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line2)}
.glyph u{display:block;width:100%;border-radius:3px 3px 0 0}
.glyph.dual{position:relative}
.glyph.dual u+u{position:absolute;left:0;bottom:0;box-shadow:0 -2px 0 var(--bg)}
.legend b{font-family:var(--name);font-weight:500;font-size:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:9px 16px;border:1px solid var(--line2);border-radius:999px;display:flex;gap:10px;align-items:baseline;transition:background .3s,color .3s,border-color .3s}
.tab small{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected=true] small{color:rgba(13,13,14,.6)}
.songs{list-style:none;padding:0;border-top:1px solid var(--line2)}
.songs li{border-bottom:1px solid var(--line);opacity:0;transform:translateY(18px);animation:rowin .8s var(--ease) forwards}
@keyframes rowin{to{opacity:1;transform:none}}
.songs.still li{animation:none;opacity:1;transform:none}
@keyframes came{from{background-color:rgba(243,239,232,.11)}to{background-color:transparent}}
.song.came{animation:came 1.8s var(--ease)}
.song{width:100%;text-align:left;display:grid;grid-template-columns:54px minmax(0,1fr) auto 140px;gap:clamp(12px,2.4vw,34px);align-items:center;padding:22px 6px;
  transition:padding .55s var(--ease),background .45s,opacity .35s}
.song:hover,.song:focus-visible{padding-left:26px;background:linear-gradient(90deg,rgba(243,239,232,.06),transparent 72%)}
.songs:hover .song:not(:hover){opacity:.4}
.song .no{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.song h3{font-family:var(--serif);font-weight:400;font-size:clamp(32px,5.6vw,88px);line-height:1;letter-spacing:-.012em;overflow-wrap:anywhere}
.song .meta{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px}
.song .state{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.new{border-color:var(--ink2);color:var(--ink)}
.songs li.mark{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:baseline;padding:16px 6px 14px;border-top:1px solid var(--ink2);border-bottom:1px solid var(--line)}
.songs li.mark b{font-family:var(--name);font-weight:500;font-size:15px;letter-spacing:.02em}
.songs li.mark span{color:var(--ink2);font-size:12.5px;line-height:1.7;max-width:72ch}
.song canvas{width:132px;height:132px;justify-self:end;transition:transform .9s var(--ease)}
.song:hover canvas{transform:scale(1.13) rotate(28deg)}
.empty{padding:44px 6px;color:var(--ink2);font-size:16px;line-height:1.8}
.find{display:flex;gap:14px;align-items:center;margin:-4px 0 18px}
.find .box{position:relative;flex:0 1 380px;min-width:0}
.find input{width:100%;background:rgba(243,239,232,.04);border:1px solid var(--line2);border-radius:999px;padding:9px 40px 9px 16px;font-size:14px;transition:border-color .25s,background .25s}
.find input::placeholder{color:var(--ink3)}
.find input:focus{outline:none;border-color:var(--ink);background:rgba(243,239,232,.07)}
.find input::-webkit-search-cancel-button{display:none}
.find .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;color:var(--ink2);font-size:16px;line-height:1;transition:color .25s,background .25s}
.find .x:hover{color:var(--ink);background:rgba(243,239,232,.1)}
.totop{position:fixed;right:clamp(16px,3vw,40px);bottom:clamp(16px,3vw,36px);z-index:30;display:flex;gap:8px;align-items:center;padding:10px 16px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);backdrop-filter:blur(16px);color:var(--ink2);font-size:12.5px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease),color .25s,border-color .25s}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop:hover{color:var(--ink);border-color:var(--ink)}
.foot{margin-top:34px;line-height:1.9}

/* ---------- 编辑页 ---------- */
#editor{display:grid;grid-template-columns:316px minmax(0,1fr);height:100vh}
.side{padding:18px 22px 24px;border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:15px;background:var(--panel);backdrop-filter:blur(16px)}
.side>*{flex-shrink:0}
.sideTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{color:var(--ink2);padding:6px 0;transition:color .25s,transform .4s var(--ease)}
.back:hover{color:var(--ink);transform:translateX(-4px)}
.edTitle{font-family:var(--serif);font-weight:400;font-size:clamp(32px,3.1vw,50px);line-height:1;letter-spacing:-.01em;overflow-wrap:anywhere}
.ringWrap{position:relative;aspect-ratio:1;width:100%;max-width:272px;align-self:center;margin:2px 0;container-type:inline-size}
#ring{width:100%;height:100%;display:block;cursor:pointer;touch-action:none}
.ringCore{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:1.2cqw;pointer-events:none;text-align:center}
.ringCore b{font-family:var(--serif);font-weight:400;font-size:min(40px,15cqw);line-height:1;font-variant-numeric:tabular-nums}
.ringCore span{font-size:min(10.5px,4.1cqw)}
.ringCore em{font-style:normal;font-family:var(--name);font-weight:500;font-size:min(13.5px,5.2cqw);line-height:1.3;color:var(--lead);min-height:1.3em;max-width:44cqw}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fact{background:rgba(13,13,14,.82);padding:10px 12px}
.fact b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.fact span{font-size:11.5px;color:var(--ink2)}
.fact.wide{grid-column:1/-1}
.fact.wide p{font-size:12.5px;color:var(--ink2);line-height:1.65}
.group h4{color:var(--ink3);margin-bottom:8px;font-weight:400}
.brushes{display:grid;gap:4px}
.brush{display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:end;padding:7px 10px;border-radius:10px;border:1px solid transparent;text-align:left;transition:background .25s,border-color .25s}
.brush:hover{background:rgba(243,239,232,.05)}
.brush[aria-pressed=true]{border-color:var(--line2);background:rgba(243,239,232,.08)}
.brush b{font-family:var(--name);font-weight:500;font-size:15px;line-height:1.3}
.brush kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.brush.add{margin-top:6px}
.brush.add[aria-pressed=true]{border-color:var(--ink2);background:rgba(243,239,232,.12)}
.addHint{font-size:11px;line-height:1.6;padding:2px 10px 0}
.brush.add.off{opacity:.45}
textarea{width:100%;min-height:74px;resize:vertical;background:rgba(243,239,232,.04);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.6}
textarea:focus{outline:none;border-color:var(--line2)}
.doneBtn{margin-top:9px;width:100%;padding:11px 14px;border-radius:999px;border:1px solid var(--line2);transition:background .3s,color .3s,border-color .3s}
.doneBtn:hover{border-color:var(--ink)}
.doneBtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#saveState{margin-top:9px;min-height:17px;text-transform:none;letter-spacing:.02em}
#saveState.err{color:#ff8f6b;cursor:pointer}

.stage{display:flex;flex-direction:column;min-width:0;height:100vh}
.lanes{position:relative;flex:1;min-height:0;overflow:hidden}
.heads{position:absolute;left:0;top:0;bottom:0;width:172px;z-index:2;border-right:1px solid var(--line)}
.head{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:0 10px 0 18px;transition:opacity .3s}
.head.off{opacity:.34}
.head .nm{font-family:var(--name);font-weight:500;font-size:16px;line-height:1.15;white-space:nowrap}
html[lang=en] .head .nm{font-size:14px}
.head .en{display:block;font-family:var(--mono);font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.head .solo{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);color:var(--ink2);font:500 10px var(--mono);transition:background .25s,color .25s,transform .3s var(--ease)}
.head .solo:hover{transform:scale(1.12);color:var(--ink);border-color:var(--ink)}
.head .solo[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.head .share{position:absolute;left:18px;right:10px;bottom:3px;height:3px;display:flex;border-radius:2px;overflow:hidden;background:rgba(243,239,232,.07)}
.head.small .nm{font-size:13px;color:var(--ink2)}
.head>span:first-child{min-width:0}
.head .nm,.head .en{overflow:hidden;text-overflow:ellipsis}
html[lang=en] .head.small .nm{font-size:12.5px}
html[lang=en] .head.small .en{display:none}
/* 窗口太矮、每行很窄时：只留轨名，按钮和字都缩小 */
.heads.tight .head:not(.small) .en{display:none}
.heads.tight .head .nm{font-size:13px}
.heads.tight .head .solo{width:20px;height:20px;font-size:9px}
.head.cap{align-items:flex-end;padding-bottom:6px;color:var(--ink3)}
#tl{position:absolute;left:172px;top:0;width:calc(100% - 172px);height:100%;display:block;touch-action:none}
.tip{position:absolute;z-index:6;pointer-events:none;background:#1a1a1c;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.6;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tip b{font-family:var(--name);font-weight:500;font-size:13.5px}
.tip i{font-style:normal;color:var(--ink2)}

.dock{position:relative;z-index:8;display:flex;align-items:center;gap:10px 14px;padding:11px 18px;border-top:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);flex-wrap:wrap}
.play{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform .35s var(--ease)}
.play:hover{transform:scale(1.08)}
.play svg{width:16px;height:16px;fill:currentColor}
.clock{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:92px}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:2px}
.seg button{padding:6px 13px;border-radius:999px;font-size:12.5px;color:var(--ink2);transition:background .25s,color .25s;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--ink2);display:flex;gap:7px;align-items:center;white-space:nowrap;transition:border-color .25s,color .25s,background .25s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed=true]{background:rgba(243,239,232,.12);color:var(--ink);border-color:var(--line2)}
.chip:disabled{opacity:.35;cursor:default}
.chip kbd{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.listen{font-size:12.5px;color:var(--ink2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listen b{font-family:var(--name);font-weight:500;color:var(--ink)}
.grow{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:2px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);cursor:pointer}
/* 播放设备菜单 */
.menuWrap{position:relative}
#outBtn span{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;bottom:calc(100% + 10px);left:0;z-index:12;min-width:280px;max-width:380px;background:#1a1a1c;border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.menu button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:8px 11px;border-radius:9px;font-size:13px;color:var(--ink2)}
.menu button:hover{background:rgba(243,239,232,.08);color:var(--ink)}
.menu button[aria-checked=true]{color:var(--ink)}
.menu button i{font-style:normal;width:12px;color:var(--lead)}
.menu p{padding:8px 11px;font-size:12px;line-height:1.6;color:var(--ink3)}
/* 拍速与网格的菜单 */
.gridMenu{min-width:340px;max-width:372px;padding:14px 14px 12px;display:grid;gap:11px}
.gridMenu h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:400}
.gridMenu .src,.gridMenu .hint{padding:0}
.gridMenu .src{font-size:12.5px;line-height:1.55;color:var(--ink2)}
.gridMenu .src b{color:var(--ink);font-weight:500}
.gridMenu .hint{font-size:11.5px;line-height:1.65;color:var(--ink3)}
.gridMenu .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gridMenu .row>span{font-size:12.5px;color:var(--ink2)}
.gridMenu .row.end{justify-content:space-between;margin-top:2px}
.gridMenu button{width:auto;display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;color:var(--ink2);white-space:nowrap;transition:border-color .25s,color .25s}
.gridMenu button:hover{background:none;border-color:var(--ink);color:var(--ink)}
.gridMenu button:disabled{opacity:.32;cursor:default;border-color:var(--line2);color:var(--ink2)}
.gridMenu button.sq{width:30px;height:30px;padding:0;border-radius:50%;font-size:13px}
.gridMenu button.wide{width:100%;justify-content:flex-start;text-align:left;border-radius:11px;padding:8px 12px;white-space:normal;line-height:1.45}
.gridMenu button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gridMenu button.go:hover{background:var(--ink);color:var(--bg)}
.gridMenu input{width:96px;height:30px;text-align:center;background:rgba(243,239,232,.05);border:1px solid var(--line2);border-radius:999px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.gridMenu input::-webkit-outer-spin-button,.gridMenu input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gridMenu input:focus{outline:none;border-color:var(--ink)}
.gridMenu .bpbVal{font-family:var(--mono);font-size:13px;font-weight:500;min-width:22px;text-align:center;color:var(--ink)}
#bpmBtn b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip.pend{border-color:var(--lead);color:var(--ink)}
/* 重新识别 */
.reRow{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;margin-top:11px}
.reRow .chip{font-size:12px;padding:5px 12px}
.reRow .chip.go{background:var(--lead);border-color:var(--lead);color:var(--bg)}
.reRow .chip.go:hover{border-color:var(--ink);color:var(--bg)}
.gridMenu .off{font-family:var(--mono);font-size:11px;color:var(--ink3)}
#reState{text-transform:none;letter-spacing:.02em;line-height:1.5}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:86vw}

/* 历史版本（2026-10-16） */
.histWrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px}
.histPanel{width:min(660px,100%);max-height:86vh;overflow:auto;background:#161618;border:1px solid var(--line2);border-radius:18px;padding:18px 20px 16px;box-shadow:0 24px 70px rgba(0,0,0,.6);display:grid;gap:14px}
.histTop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.histTop h3{font-family:var(--name);font-weight:500;font-size:20px;line-height:1.3}
.histTop .x{flex:none;width:30px;height:30px;border-radius:50%;color:var(--ink2);font-size:18px;line-height:1;transition:color .25s,background .25s}
.histTop .x:hover{color:var(--ink);background:rgba(243,239,232,.1)}
.histPanel h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:400;margin:2px 0 7px}
.histItem{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.histItem.cur{border-color:var(--line2);background:rgba(243,239,232,.05)}
.histItem b{font-family:var(--name);font-weight:500;font-size:15px}
.histItem .pill{margin-left:4px}
.histPanel .sub{font-size:12px;line-height:1.6;color:var(--ink2);margin-top:2px}
.histItem .acts{display:flex;gap:6px}
.histItem .chip,.histBar .chip{font-size:12px;padding:5px 12px}
.histItem .chip.go,.histBar .chip.go{background:var(--lead);border-color:var(--lead);color:var(--bg)}
.histItem .chip.go:hover,.histBar .chip.go:hover{border-color:var(--ink)}
.histKeep{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink2);line-height:1.55;cursor:pointer}
.histKeep input{margin-top:3px;accent-color:var(--lead)}
.histFoot{font-size:11.5px;line-height:1.65}
.histBar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid var(--lead);background:rgba(238,94,35,.13);font-size:13px;color:var(--ink2)}
.histBar b{font-family:var(--name);font-weight:500;color:var(--ink)}

@media (max-width:1080px){
  #editor{grid-template-columns:250px minmax(0,1fr)}
  .side{padding:16px 16px 20px}
  .facts{grid-template-columns:1fr}
}
@media (max-width:760px){
  #editor{grid-template-columns:1fr;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .ringWrap{max-width:200px}
  .stage{height:92vh}
  .song{grid-template-columns:34px minmax(0,1fr) 92px}
  .song .state{display:none}
  .song canvas{width:92px;height:92px}
}
@media (prefers-reduced-motion:reduce){
  .aura i,.title .ln>b,.songs li{animation:none}
  .title .ln>b{transform:none}
  .songs li{opacity:1;transform:none}
  *{transition-duration:.01ms!important}
}
/* 演示版：要本机 Python 环境的功能藏起来 */
#reBtn,#reState,#modeAlign,#applyBtn,#dropBtn,#gridMenu,#histBtn,#histWrap{display:none!important}
#bpmBtn{pointer-events:none}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<main id="home" class="view">
  <header class="top">
    <span class="l"><span class="mono">FN Studio</span>
      <nav class="sections" data-t-aria-label="secAria"><a href="./" aria-current="page" data-t="secLabels"></a><a href="regen.html" data-t="secRegen"></a><a href="gate2.html">奏 / 不奏训练</a></nav></span>
    <span class="r"><span class="mono dim" id="homeCount"></span><span class="lvl" role="group" data-t-title="levelTip"><button data-level="1" data-t="level1">一级</button><button data-level="2" data-t="level2">二级</button></span><span class="lang" role="group" aria-label="Language"><button data-lang="zh">中</button><button data-lang="en">EN</button></span></span>
  </header>
  <section class="hero">
    <p class="mono kicker" data-t="kicker"></p>
    <h1 class="title" id="heroTitle" data-t-html="heroTitle" data-t-aria-label="docTitle"></h1>
    <p class="lede" data-t="lede"></p>
    <ul class="legend" id="legend"></ul>
  </section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="find" id="findBar" role="search">
    <span class="box"><input id="find" type="search" autocomplete="off" spellcheck="false" data-t-placeholder="findPh" data-t-aria-label="findPh"><button class="x" id="findClear" type="button" hidden data-t-title="findClear" data-t-aria-label="findClear">×</button></span>
    <span class="mono dim" id="findCount" aria-live="polite"></span>
  </div>
  <ol class="songs" id="songs"></ol>
  <button class="totop" id="toTop" type="button"><span aria-hidden="true">↑</span><span data-t="toTop"></span></button>
  <p class="foot mono dim" data-t="foot"></p>
</main>

<main id="editor" class="view" hidden>
  <aside class="side">
    <div class="sideTop">
      <button class="back mono" id="back" data-t="back"></button>
      <span class="lvl" role="group" data-t-title="levelTip"><button data-level="1" data-t="level1">一级</button><button data-level="2" data-t="level2">二级</button></span><span class="lang" role="group" aria-label="Language"><button data-lang="zh">中</button><button data-lang="en">EN</button></span>
    </div>
    <div>
      <p class="mono dim" id="edKicker"></p>
      <h2 class="edTitle" id="edTitle"></h2>
      <p class="mono dim" id="edMeta" style="margin-top:8px"></p>
      <div class="reRow">
        <span class="vsw" role="group" data-t-title="viewTip"><button data-view="beat" data-t="viewBeat"></button><button data-view="bar" data-t="viewBar"></button></span>
        <button class="chip go" id="applyBtn" data-t="applyBtn" data-t-title="applyTip" hidden></button>
        <button class="chip" id="dropBtn" data-t="dropBtn" hidden></button>
        <button class="chip beatOnly" id="reBtn" data-t-title="reTip"><span id="reLabel"></span></button>
        <button class="chip beatOnly" id="histBtn" data-t="histBtn" data-t-title="histTip"></button>
        <span class="mono dim" id="reState" role="status"></span>
      </div>
    </div>
    <div class="ringWrap">
      <canvas id="ring" data-t-aria-label="ringAria"></canvas>
      <div class="ringCore"><b id="rTime">0:00</b><span class="mono dim" id="rBeat"></span><em id="rLead"></em></div>
    </div>
    <div class="facts" id="facts"></div>
    <div class="group">
      <h4 class="mono" data-t="brushHead"></h4>
      <div class="brushes" id="brushes"></div>
    </div>
    <div class="group">
      <h4 class="mono" data-t="noteHead"></h4>
      <textarea id="note" maxlength="20000" data-t-placeholder="notePh"></textarea>
      <button class="doneBtn" id="done" aria-pressed="false" data-t="doneBtn"></button>
      <p class="mono dim" id="saveState" role="status"></p>
    </div>
  </aside>
  <section class="stage">
    <div class="histBar" id="histBar" hidden role="status"><span id="histBarText"></span><span class="grow"></span><button class="chip go" id="histBarRestore" data-t="histRestore"></button><button class="chip" id="histBarBack" data-t="histBack"></button></div>
    <div class="lanes" id="lanes">
      <div class="heads" id="heads"></div>
      <canvas id="tl" data-t-aria-label="tlAria"></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="dock">
      <button class="play" id="play" data-t-aria-label="playAria"><svg viewBox="0 0 16 16" id="playIcon"><path d="M3 1.5v13l11-6.5z"/></svg></button>
      <span class="clock" id="clock">0:00 / 0:00</span>
      <div class="menuWrap beatOnly">
        <button class="chip" id="bpmBtn" aria-haspopup="true" aria-expanded="false" data-t-title="bpmTip"><span id="bpmLabel"></span></button>
        <div class="menu gridMenu" id="gridMenu" hidden></div>
      </div>
      <button class="chip beatOnly" id="metroBtn" aria-pressed="false" data-t="metroBtn" data-t-title="metroTip"></button>
      <button class="chip" id="retBtn" aria-pressed="false" data-t="retBtn" data-t-title="retTip"></button>
      <div class="seg" role="group" data-t-aria-label="modeAria">
        <button id="modePoint" aria-pressed="true" data-t="modePoint" data-t-title="modePointTip"></button>
        <button id="modeEdit" aria-pressed="false" data-t="modeEdit" data-t-title="modeEditTip"></button>
        <button id="modeListen" aria-pressed="false" data-t="modeListen" data-t-title="modeListenTip"></button>
        <button id="modeAlign" class="beatOnly" aria-pressed="false" data-t="modeAlign" data-t-title="modeAlignTip"></button>
      </div>
      <span class="listen" id="listen"></span>
      <button class="chip" id="clearSolo" hidden><span data-t="clearSolo"></span> <kbd>Esc</kbd></button>
      <span class="grow"></span>
      <div class="menuWrap">
        <button class="chip" id="outBtn" aria-haspopup="true" aria-expanded="false" data-t-title="outTip"><span id="outLabel"></span></button>
        <div class="menu" id="outMenu" role="menu" hidden></div>
      </div>
      <button class="chip" id="prevU" data-t="prevU" data-t-title="prevUTip"></button>
      <button class="chip" id="nextU" data-t="nextU" data-t-title="nextUTip"></button>
      <button class="chip" id="showU" aria-pressed="true" data-t="showU" data-t-title="showUTip"></button>
      <button class="chip" id="showW" aria-pressed="true" data-t="showW" data-t-title="showWTip"></button>
      <button class="chip" id="undo" data-t="undo" data-t-title="undoTip" disabled></button>
      <button class="chip" id="redo" data-t="redo" data-t-title="redoTip" disabled></button>
      <button class="chip" id="follow" aria-pressed="true" data-t="follow" data-t-title="followTip"></button>
      <button class="chip" id="fit" data-t="fit" data-t-title="fitTip"></button>
      <input type="range" id="zoom" min="0" max="1000" value="0" data-t-aria-label="zoomAria">
    </div>
  </section>
</main>

<div class="histWrap" id="histWrap" hidden><div class="histPanel" role="dialog" aria-modal="true" aria-labelledby="histTitle">
  <div class="histTop"><h3 id="histTitle"></h3><button class="x" id="histClose" type="button" data-t-title="histClose" data-t-aria-label="histClose">×</button></div>
  <div id="histBody"></div>
  <p class="histFoot dim" data-t="histFoot"></p>
</div></div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="demo.js"></script>
<script src="app.js"></script>
